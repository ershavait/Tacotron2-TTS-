[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tacotron2-tts"
version = "0.1.0"
description = "Two-stage Text-To-Speech system featuring Tacotron2 (Spectrogram Generation) and HiFi-GAN (Neural Vocoder)"
readme = "README.md"
authors = [{ name = "Priyam Mazumdar" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "accelerate>=0.28.0",
    "transformers>=4.38.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
